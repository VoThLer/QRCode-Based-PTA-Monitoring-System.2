<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — EskwelaPay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="boot-screen" class="boot-screen">Loading EskwelaPay…</div>

<div id="login-screen" style="display:none;">
  <div class="login-card" id="login-card-content"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/firebase-config.js"></script>
<script src="js/shared.js"></script>
<script>
let ANY_ADMIN_EXISTS = null;

async function boot(){
  const configFilledIn = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE_YOUR');
  if(!configFilledIn){
    document.getElementById('boot-screen').innerHTML =
      'This file needs your Firebase project config pasted in near the top of js/firebase-config.js ' +
      '(see the setup comment) before it can run. Once that is in place, reload this page.';
    return;
  }
  auth.onAuthStateChanged(async (user)=>{
    if(user){
      const accDoc = await fsDb.collection('accounts').doc(user.uid).get();
      if(!accDoc.exists){
        showToast('Account has no role record - contact your PTA officer.', 'error');
        await auth.signOut();
        return;
      }
      const acc = accDoc.data();
      window.location.href = HOME_PAGE[acc.role] || 'login.html';
    }else{
      await checkAdminExists();
      showLogin();
    }
  });
}
async function checkAdminExists(){
  try{
    const snap = await fsDb.collection('accounts').where('role','==','admin').limit(1).get();
    ANY_ADMIN_EXISTS = !snap.empty;
  }catch(e){
    // Before any account/rule exists yet, or offline - assume bootstrap needed.
    ANY_ADMIN_EXISTS = false;
  }
}

/* ============================================================
   LOGIN SCREEN
============================================================ */
function showLogin(){
  document.getElementById('boot-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  const box = document.getElementById('login-card-content');

  if(!ANY_ADMIN_EXISTS){
    box.innerHTML = `
      <div class="seal-row">
        <div class="seal seal-img"><img src="assets/logo.png" alt="EskwelaPay seal"></div>
        <div><div class="login-eyebrow">Sta. Lucia National High School · Pagadian City</div></div>
      </div>
      <h1>EskwelaPay</h1>
      <div class="login-sub">First-time setup - create the PTA Officer / Admin account.</div>
      <div class="setup-banner">No Admin account exists yet in this Firebase project. Create one now - you'll use it to log in and to create every other account (Principal, Adviser, Parent, Student) afterward.</div>
      <div class="login-field"><label>Admin's full name</label><input id="boot-name" placeholder="e.g. Liza Fernandez"></div>
      <div class="login-field"><label>Choose a username</label><input id="boot-user" placeholder="e.g. admin" class="mono"></div>
      <div class="login-field"><label>Choose a password</label><input id="boot-pass" type="password" placeholder="minimum 6 characters"></div>
      <button class="btn-primary" id="boot-btn">Create Admin account &amp; continue</button>
      <div class="login-error" id="login-error"></div>
    `;
    document.getElementById('boot-btn').addEventListener('click', async ()=>{
      const err = document.getElementById('login-error');
      const name = document.getElementById('boot-name').value.trim();
      const user = document.getElementById('boot-user').value.trim();
      const pass = document.getElementById('boot-pass').value;
      if(!name || !user || !pass){ err.textContent='Fill in every field.'; return; }
      if(pass.length<6){ err.textContent='Password needs to be at least 6 characters.'; return; }
      try{
        const cred = await auth.createUserWithEmailAndPassword(slug(user)+LOGIN_DOMAIN, pass);
        await fsDb.collection('accounts').doc(cred.user.uid).set({role:'admin', name, username:slug(user)});
        await fsDb.collection('settings').doc('main').set(SETTINGS, {merge:true});
        showToast('Admin account created. Welcome!', 'success');
        // onAuthStateChanged will pick this up and redirect to admin.html.
      }catch(e){
        err.textContent = friendlyAuthError(e);
      }
    });
    return;
  }

  box.innerHTML = `
    <div class="seal-row">
      <div class="seal seal-img"><img src="assets/logo.png" alt="EskwelaPay seal"></div>
      <div><div class="login-eyebrow">Sta. Lucia National High School · Pagadian City</div></div>
    </div>
    <h1>EskwelaPay</h1>
    <div class="login-sub">QR code-based PTA payment monitoring. Log in below.</div>
    <div class="login-field"><label>Username / Student ID</label><input id="login-user" class="mono" autocomplete="username"></div>
    <div class="login-field"><label>Password</label><input type="password" id="login-pass" autocomplete="current-password"></div>
    <button class="btn-primary" id="login-btn">Log in</button>
    <div class="login-error" id="login-error"></div>
    <div class="login-note" style="margin-top:16px;">
      Real accounts, checked by Firebase Authentication - each role only sees what its Security Rules allow, enforced on the server, not just hidden in the interface.
      Students/parents log in with the Student ID and password the Admin generated for them.
    </div>
  `;
  document.getElementById('login-btn').addEventListener('click', async ()=>{
    const err = document.getElementById('login-error');
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    if(!user || !pass){ err.textContent='Enter both a username/ID and password.'; return; }
    try{
      await auth.signInWithEmailAndPassword(slug(user)+LOGIN_DOMAIN, pass);
      err.textContent='';
    }catch(e){
      err.textContent = friendlyAuthError(e);
    }
  });
}
function friendlyAuthError(e){
  if(!e || !e.code) return 'Something went wrong. Try again.';
  if(e.code.includes('wrong-password') || e.code.includes('user-not-found') || e.code.includes('invalid-credential')) return 'Incorrect username or password.';
  if(e.code.includes('email-already-in-use')) return 'That username is already taken.';
  if(e.code.includes('weak-password')) return 'Password needs to be at least 6 characters.';
  return e.message || 'Something went wrong. Try again.';
}

boot();
</script>
</body>
</html>
